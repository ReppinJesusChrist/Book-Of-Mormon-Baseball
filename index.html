<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Book of Mormon Baseball</title>
    <link rel="icon" type="image/x-icon" href="./images/BOM_icon_image.jpg"/>
    <link rel="stylesheet" href="_base.css" /> 
    <link rel="stylesheet" href="_layout.css" /> 
    <link rel="stylesheet" href="_pages.css" /> 
    <link rel="stylesheet" href="_components.css" />
    <link rel="stylesheet" href="_mobile.css" /> 
</head>

<body>
    <header id="header-bar">
        <div class="header-left">
            <div class="dropdown single-select nav-dropdown">
                <button id="nav-toggle" class="dropdown-trigger">☰</button>
                <div id="nav-menu" class="dropdown-content">
                    <div class="nav-item custom-option main-menu-button" data-target="menu">Main Menu</div>
                    <div class="nav-item custom-option settings-button" data-target="settings">Settings</div>
                    <div class="nav-item custom-option lb-button" data-target="leaderboard">Leaderboard</div>
                    <div class="nav-item custom-option" data-target="statistics">Statistics</div>
                </div>
            </div>
        </div>

        <div id="header-title" class="main-menu-button">Book of Mormon Baseball!!!</div>
    </header>
    <div id="main-content">
        <div id="menu-screen">
        <h1>Welcome to Book of Mormon Baseball!</h1>
        <button class="start-button" id="start-button">Start Game</button>
        <button id="settings-button" class="settings-button">Settings</button>
        <button id="leaderboard-button" class="lb-button">Leaderboard</button>
        </div>
        <div id="game-screen" style="display:none;">
            <div id="container">
                <div id="left-panel">
                    <div id="verse-display-container">
                        <div id="verses"></div>
                    </div>
                    <div id="timer-container">
                        <div id="timer-bar"></div>    
                    </div>
                    <div class="controls" id="guess-section">
                        <div class="dropdown single-select" id="book-dropdown">
                            <button class="dropdown-trigger" id="book-select-trigger">Select Book: </button>
                            <div class="dropdown-content" id="book-select"></div>
                        </div>

                        <div class="dropdown single-select narrow" id="game-chapter-dropdown">
                            <button class="dropdown-trigger" id="game-chapter-select-trigger">Chap:</button>
                            <div class="dropdown-content" id="game-chapter-select"></div>
                        </div>
                    
                        <button id="finalizeGuess" disabled="true">Guess</button>
                    </div>

                    <!--Formatting uses span now even though it's unused, so I can add labels to each later-->
                    <div id="result" aria-live="polite"><span id="game-result-reveal-span"></span></div>
                    <div id="reference" aria-live="polite"><span id="game-ref-reveal-span"></span> </div>

                    <div class="controls">
                        <button id="revealReference" disabled>Reveal Reference</button>
                        <button id="newRound" disabled>New Round</button>
                    </div>

                    <button class="restart-button hidden" id="restart-button">Restart Game</button>
                </div>
            <div id="right-panel">
                <div id="diamond">
                    <div class="base" id="home"></div>
                    <div class="base" id="first"></div>
                    <div class="base" id="second"></div>
                    <div class="base" id="third"></div>
                </div>
                <div id = "scoreboard">
                    <div id="strike-boxes">
                        <div class="strike-box" id="strike-box-1"></div>
                        <div class="strike-box" id="strike-box-2"></div>
                        <div class="strike-box" id="strike-box-3"></div>
                    </div>
                    <div id="roundDisplay">Round: <span id="round">__</span></div>
                    <div id="scoreDisplay">Score: <span id="score">__</span></div>
            </div>
        </div>
        </div>
        <div id="game-over-overlay" class="hidden">
            <div class="overlay-content">
            <h2>Game Over</h2>
            <p>Your final score is: <span id="final-score">__</span></p>
            <button class="start-button GO-button" id="go-btns-tryagain">Play Again?</button>
            <button class="main-menu-button GO-button" id="game-over-menu-btn">Back to Main Menu</button>
            <button class="GO-button" id="hide-overlay">Back to Game Screen</button>
            </div>
        </div>
        <div id="strike-effect-display" aria-hidden="true">
            <span class="strike-text"></span>
        </div>
        <div id="settings-screen" style="display:none;">
            <h2>Settings</h2>
            <div id="settings-book-volume-selection">
                <label for="volume-select-dropdown-label">Select Volume:</label>
                <select id="settings-vselect-value">
                    <option value="ot">Old Testament</option>
                    <option value="nt">New Testament</option>
                    <option value="bofm" selected>Book of Mormon</option>
                    <option value="dc">Doctrine and Covenants</option>
                    <option value="gc">General Conference (2024 and later)</option>
                    <option value="custom">Custom Study Plan</option>
                </select>
                <label for="include-exclude-dropdown-label">Select Books/Subsections to include</label>
                <div class="dropdown multi-select">
                    <button type="button" class="dropdown-trigger">Show/Hide book options</button>
                    <div id="include-exclude-values" class="dropdown-content"></div>
                </div>
                    <!-- Options will be populated dynamically based on selected volume -->
                <button id="check-all-inex">Select All</button>
                <button id="uncheck-all-inex">Deselect All</button>
            </div>
            <!--<div id="difficulty-selection">
                <label for="difficulty-dropdown-label">Select Difficulty:</label>
                <select id="difficulty-value">
                    <option value="unlimited">No Time Limit</option>
                    <option value="leisurely">Leisurely (3mins)</option>
                    <option value="relaxed">Relaxed (1min)</option>
                    <option value="easy" selected>Easy (30s)</option>
                    <option value="medium">Medium (20s)</option>
                    <option value="hard">Hard (10s)</option>
                </select>
            </div>-->
            <div id="threshold-selection">
                <label for="threshold-dropdown-label">Select Difficulty:</label>
                <select id="threshold-value">
                    <option value="easiest">Hit the side of Noah's ark (Single: 250 chapters, Double: 100 chapters, Triple: 50 chapters, Home Run: 25 chapters)</option>
                    <option value="easier">Hit the side of a barn (Single: 100 chapters, Double: 50 chapters, Triple: 25 chapters, Home Run: 12 chapters)</option>
                    <option value="easy">Love thy neighbor (Single: 50 chapters, Double: 25 chapters, Triple: 12 chapters, Home Run: 7 chapters)</option>
                    <option value="average">Follow the star (Single: 25 chapters, Double: 12 chapters, Triple: 7 chapters, Home Run: 4 chapters)</option>
                    <option value="hard" selected>Enter at the gate (Single: 12 chapters, Double: 7 chapters, Triple: 4 chapters, Home Run: 2 chapters)</option>
                    <option value="harder">Hold the iron rod (Single: 7 chapters, Double: 4 chapters, Triple: 2 chapters, Home Run: 1 chapters)</option>
                    <option value="hardest">Find the piece of silver (Single: 4 chapters, Double: 2 chapters, Triple: 1 chapter, Home Run: Dead-on)</option>
                </select>
            </div>
            <button class="main-menu-button">Back to Menu</button>
        </div>
        <div id="leaderboard-screen" style="display:none;">
            <div id="lb-container">
                <div id="lb-book-ladder">
                    <button class="lb-book-option" data-diff="bofm">Book of Mormon</button>
                    <button class="lb-book-option" data-diff="ot">Old Testament</button>
                    <button class="lb-book-option" data-diff="nt">New Testament</button>
                    <button class="lb-book-option" data-diff="dc">Doctrine and Covenants</button>
                    <button class="lb-book-option" data-diff="gc">General Conference</button>
                    <button class="lb-book-option" data-diff="custom">Custom Study Plan</button>
                </div>
                <div id="lb-difficulty-ladder">
                    <button class="lb-difficulty-option" data-diff="easiest">Hit Noah's ark</button>
                    <button class="lb-difficulty-option" data-diff="easier">Find the stable</button>
                    <button class="lb-difficulty-option" data-diff="easy">Love thy neighbor</button>
                    <button class="lb-difficulty-option" data-diff="average">Follow the star</button>
                    <button class="lb-difficulty-option" data-diff="hard">Enter at the Gate</button>
                    <button class="lb-difficulty-option" data-diff="harder">Hold to the rod</button>
                    <button class="lb-difficulty-option" data-diff="hardest">Find the piece of silver</button>
                    <button class="lb-difficulty-option" data-diff="custom">Custom Difficulty</button>
                </div>
                <section id="leaderboard">
                    <h2>Leaderboard - <span id="lb-display-book"></span> - <span id="lb-display-difficulty"></span></h2>
                    <table id="leaderboard-table">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Score</th>
                                <th>Date</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody>

                        </tbody>
                    </table>
                </section>
            </div>
            <button class="main-menu-button">Back to Main Menu</button>
        </div>
    </div>
    <footer id="footer-bar">
        Check out 
        <a href="https://www.churchofjesuschrist.org/study/scriptures/bofm?lang=eng" 
        target="_blank" rel="noopener noreferrer">
            The Book of Mormon
        </a> 
        itself, and
        <a href="https://www.churchofjesuschrist.org/?lang=eng" target="_blank" 
            rel="noopener noreferrer">
            The Church of Jesus Christ 
        </a>
        that publishes it!
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="BOMB.js"></script>
</body>

</html>
